name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege default: neither job needs to write anything (no PR
# comments, no tag pushes). Jobs that eventually do need more should opt in
# with their own `permissions:` block rather than raising this default.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit + e2e tests
    runs-on: ubuntu-latest
    env:
      # Vitest's global setup boots its own embedded PostgreSQL and overrides
      # DATABASE_URL for the tests that need one; APP_SECRET/PUBLIC_URL are read
      # directly by unit tests (src/lib/env.test.ts) so are set here regardless.
      # `next build` also needs all three just to evaluate route modules while
      # collecting page data (src/lib/prisma.ts and src/lib/auth/server.ts both
      # call the zod-validated getEnv() at module scope) — nothing actually
      # connects to DATABASE_URL at build time, so a well-formed placeholder is
      # enough (see the matching comment in docker/Dockerfile, where the same
      # requirement applies).
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5999/ci?schema=public"
      APP_SECRET: "ci-placeholder-secret-not-used-in-production-32-chars-min"
      PUBLIC_URL: "http://localhost:3000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build @kiri/source-sdk
        run: npm run build -w packages/source-sdk

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck service worker
        working-directory: apps/web
        run: npm run typecheck:sw

      - name: Unit + integration tests
        run: npm test

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build apps/web
        run: npm run build -w apps/web

      - name: End-to-end tests
        run: npm run test:e2e -w apps/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  docker:
    name: Validate Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (runner target, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=min,scope=runner
