# Kiri 2.0 - production compose.
#
# Quick start:
#   cp docker/.env.example docker/.env   # then set POSTGRES_PASSWORD and APP_SECRET
#   docker compose -f docker/docker-compose.yml up -d --build
#
# `--build` builds the image locally from the repo root (`context: ..`) using
# docker/Dockerfile; drop it to pull the published ghcr.io/spooknik/kiri image
# instead, or set KIRI_IMAGE to pin a specific tag (see docker/.env.example).
# `build.target` is pinned to `runner` on purpose: the Dockerfile's `browser`
# stage (Playwright + Chromium) is declared AFTER `runner` so it can build
# `FROM runner`, which means an unpinned build would silently pick `browser` —
# the bigger, opt-in variant — as Docker's "last stage" default. For the
# browser-plugin-capable variant instead, set KIRI_IMAGE to a `-browser` tag
# and drop `--build` (docs/DEPLOY.md), or override `target: browser` here.
#
# Full guide, including the reverse proxy / PUBLIC_URL, Cloudflare Access,
# backups and updating: docs/DEPLOY.md

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kiri
      POSTGRES_USER: kiri
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env — see docker/.env.example}"
    volumes:
      - kiri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiri -d kiri"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: "${KIRI_IMAGE:-ghcr.io/spooknik/kiri:latest}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_VERSION: "${NEXT_PUBLIC_APP_VERSION:-}"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://kiri:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@db:5432/kiri?schema=public"
      APP_SECRET: "${APP_SECRET:?Set APP_SECRET in docker/.env — see docker/.env.example}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3000}"
      DATA_ROOT: /data
      AUTH_CF_ACCESS: "${AUTH_CF_ACCESS:-0}"
      CF_ACCESS_TEAM_DOMAIN: "${CF_ACCESS_TEAM_DOMAIN:-}"
      CF_ACCESS_AUD: "${CF_ACCESS_AUD:-}"
      AUTH_CF_TRUST_HEADER: "${AUTH_CF_TRUST_HEADER:-0}"
      JOB_CONCURRENCY: "${JOB_CONCURRENCY:-1}"
      JOB_TIMEOUT_MS: "${JOB_TIMEOUT_MS:-7200000}"
      # `on` refuses to run a plugin the sandbox cannot be applied to; `warn`
      # is the compatibility mode that logs and retries unsandboxed. Deployments
      # start locked down — loosen it only for a plugin you trust.
      KIRI_PLUGIN_SANDBOX: "${KIRI_PLUGIN_SANDBOX:-on}"
    volumes:
      - kiri_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  kiri_pgdata:
  kiri_data:
