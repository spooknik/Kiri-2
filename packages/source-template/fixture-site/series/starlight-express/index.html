<!doctype html>
<html lang="en">

    <h1 class="series-title">Starlight Express</h1>
    <img class="cover" src="cover.png" alt="cover" />

    <!-- Newest first, the way a real site lists chapters: the plugin has to
         carry `data-number` through so Kiri can order them correctly. -->
    <ul class="chapters">
      <li>
        <a
          class="chapter"
          href="chapters/3/"
          data-id="c3"
          data-number="3"

          >Chapter 3: Terminal</a
        >
      </li>
      <li>
        <a
          class="chapter"
          href="chapters/2/"
          data-id="c2"
          data-number="2"
          data-volume="1"
          data-date="2024-04-26"
          >Chapter 2: Sidings</a
        >
      </li>
      <li>
        <a
          class="chapter"
          href="chapters/1/"
          data-id="c1"
          data-number="1"
          data-volume="1"
          data-date="2024-04-19"
          >Chapter 1: Departure</a
        >
      </li>
    </ul>
  </body>
</html>
